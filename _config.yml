# ==========================================================
#  POSTAVKE STRANICE
# ==========================================================
#  Tekstovi izbornika i natpisi na oba jezika: _data/izbornik.yml i _data/tekstovi.yml
#  Tekst na stranicama: index.md, info.md, kontakt.md  (engleski: mapa en/)

# Ime koje piše gore lijevo i u naslovu kartice preglednika
naziv: "Vedran Sminderovac"

# Adresa stranice (za Google, dijeljenje linkova i sitemap) — bez / na kraju
url: "https://vedransminderovac.com"
baseurl: ""

# Kod za potvrdu u Google Search Console (samo ako biraš metodu "HTML tag"; inače ostavi prazno)
google_potvrda: ""

# Tko je napravio stranicu (piše sitno u podnožju). Prazno "" = ne prikazuj.
izradio: "Zrinac"

# Instagram (ostavi prazno "" ako ga ne želiš prikazati)
instagram: "https://www.instagram.com/vedran.sminderovac/"

# Forma za kontakt — poruke se šalju preko servisa Web3Forms.
# Ključ se dobije besplatno na https://web3forms.com (upiše se e-mail na koji trebaju stizati poruke).
web3forms_kljuc: "66b86cd8-297e-4508-8ce0-8781414ee06c"
# Ime pošiljatelja koje piše u mailu (umjesto "FormSubmit")
forma_posiljatelj: "Web stranica – Vedran Sminderovac"
# Rezerva: ako je ključ prazan, forma koristi FormSubmit na ovu adresu.
forma_email: "vedran.sminderovac@gmail.com"

# Font za ime i naslove. Mijenja se ovdje — vidi UPUTE.md (dio "Font").
#   font_naslovi: ime fonta kako ga zove CSS
#   font_link: link na font (Fontshare ili Google Fonts); prazno "" ako nije potreban
font_naslovi: "Bebas Neue"
font_link: "https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"

# Galerije (Crno-bijelo i Boja):
#   "mozaik" = na ekranu je odjednom nekoliko slika i same se polako mijenjaju (bez scrollanja)
#   "mreza"  = sve slike jedna ispod druge (scroll)
galerija_nacin: "mozaik"
mozaik_broj: 10        # koliko slika je odjednom na ekranu
mozaik_sekunde: 5      # svakih koliko sekundi se jedna slika zamijeni
mozaik_fade: 2.5       # koliko sekundi stara slika nestaje (fade out)
mozaik_pojava: 4       # koliko sekundi se nova slika pojavljuje (fade in)

# Vodeni žig preko slika (samo na prikazu). Prazno "" = bez žiga.
vodeni_zig: ""

# true = sve slike se prikazuju crno-bijelo (čak i ako su u boji)
crno_bijele_slike: false

# ----------------------------------------------------------
#  Tehničke postavke — ne treba mijenjati
# ----------------------------------------------------------
permalink: pretty
exclude:
  - README.md
  - UPUTE.md
